name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'taskapp_backend_assignment/**'
      - 'taskapp_frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: alafiz

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./taskapp_backend_assignment
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/taskapp-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./taskapp_frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/taskapp-frontend:latest