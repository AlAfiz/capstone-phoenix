---
- name: Setup k3s Master Node
  hosts: master
  become: yes
  tasks:
    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Get k3s node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_b64

    - name: Store node token as fact
      set_fact:
        node_token: "{{ node_token_b64.content | b64decode | trim }}"

    - name: Fetch kubeconfig to Fedora workstation
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        flat: yes

- name: Setup k3s Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Install k3s agent
      shell: curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars['master_node']['private_ip'] }}:6443 K3S_TOKEN={{ hostvars['master_node']['node_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s

- name: Configure Local kubectl Access
  hosts: localhost
  connection: local
  tasks:
    - name: Update Kubernetes master IP in local kubeconfig
      replace:
        path: ~/.kube/config
        regexp: '127\.0\.0\.1'
        replace: "{{ hostvars['master_node']['ansible_host'] }}"